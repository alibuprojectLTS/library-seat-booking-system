version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: library_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: FGBROC
      POSTGRES_DB: library_booking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: .
    container_name: library_backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=library_booking
      - DB_USER=postgres
      - DB_PASSWORD=FGBROC
    depends_on:
      - postgres
    volumes:
      - ./src:/app/src
      - /app/node_modules
    restart: unless-stopped

volumes:
  postgres_data: